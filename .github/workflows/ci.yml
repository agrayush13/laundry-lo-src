name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
            ui/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix api
          npm ci --prefix ui

      - name: Build the clean database
        run: npm run db:local:reset

      - name: Check the API
        run: npm --prefix api run check

      - name: Check the UI
        run: npm --prefix ui run check
