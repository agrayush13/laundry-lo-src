<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
        />
        <title>laundrylo - get your weekends back</title>
        <meta
            name="description"
            content="Compare local laundries, read reviews, book a pickup. Clean clothes back in 24 hours."
        />
        <meta
            name="theme-color"
            content="#F3ECE0"
        />
        <link
            rel="manifest"
            href="/manifest.json"
        />
        <link
            rel="apple-touch-icon"
            href="/icons/apple-touch-icon.png"
        />
        <meta
            name="apple-mobile-web-app-capable"
            content="yes"
        />
        <meta
            name="apple-mobile-web-app-title"
            content="laundrylo"
        />
        <link
            rel="canonical"
            href="https://laundrylo.com/"
        />

        <!--
            Open Graph and Twitter previews. Crawlers do not run JavaScript and
            resolve nothing relative, so the origin is spelled out here rather
            than derived at runtime.
        -->
        <meta
            property="og:type"
            content="website"
        />
        <meta
            property="og:site_name"
            content="laundrylo"
        />
        <meta
            property="og:url"
            content="https://laundrylo.com/"
        />
        <meta
            property="og:title"
            content="laundrylo - get your weekends back"
        />
        <meta
            property="og:description"
            content="Compare local laundries, read reviews, book a pickup. Clean clothes back in 24 hours."
        />
        <meta
            property="og:image"
            content="https://laundrylo.com/og-image.png"
        />
        <meta
            property="og:image:width"
            content="1200"
        />
        <meta
            property="og:image:height"
            content="630"
        />
        <meta
            property="og:image:alt"
            content="laundrylo - get your weekends back. Pickup and delivery laundry."
        />
        <meta
            property="og:locale"
            content="en_IN"
        />
        <meta
            name="twitter:card"
            content="summary_large_image"
        />
        <meta
            name="twitter:title"
            content="laundrylo - get your weekends back"
        />
        <meta
            name="twitter:description"
            content="Compare local laundries, read reviews, book a pickup. Clean clothes back in 24 hours."
        />
        <meta
            name="twitter:image"
            content="https://laundrylo.com/og-image.png"
        />

        <link
            rel="preconnect"
            href="https://fonts.googleapis.com"
        />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
    </body>
</html>
